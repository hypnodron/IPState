version: 2

multi-ecosystem-groups:
  monthly-maintenance:
    schedule:
      interval: monthly

updates:
  - package-ecosystem: github-actions
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: monthly-maintenance
  - package-ecosystem: swift
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: monthly-maintenance
  - package-ecosystem: pip
    directory: /Scripts
    patterns: ["*"]
    multi-ecosystem-group: monthly-maintenance
