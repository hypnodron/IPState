name: Build and test

on:
  push:
    branches: [master]
    paths:
      - 'Sources/**'
      - 'Tests/**'
      - 'Scripts/**'
      - 'Support/**'
      - 'Package.swift'
      - 'Package.resolved'
      - 'LICENSE'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'Sources/**'
      - 'Tests/**'
      - 'Scripts/**'
      - 'Support/**'
      - 'Package.swift'
      - 'Package.resolved'
      - 'LICENSE'
      - '.github/workflows/**'
  workflow_dispatch:
    inputs:
      create_archive:
        description: Create and upload a downloadable app archive
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-package:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Test without live provider requests
        run: bash Scripts/swift.sh test
      - name: Build universal app
        if: github.event_name != 'workflow_dispatch' || !inputs.create_archive
        run: bash Scripts/build-app.sh --universal
      - name: Package universal app
        if: github.event_name == 'workflow_dispatch' && inputs.create_archive
        run: bash Scripts/package-release.sh
      - name: Verify modern icon resources
        run: |
          xcrun assetutil --info "build/IP State.app/Contents/Resources/Assets.car" > build/icon-assets.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          assets = json.loads(Path("build/icon-assets.json").read_text())
          assert any(a.get("AssetType") == "IconImageStack" and a.get("Name") == "AppIcon" for a in assets)
          PY
      - name: Upload app archive and checksum
        if: github.event_name == 'workflow_dispatch' && inputs.create_archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: IPState-universal-macos
          path: |
            build/release/*.zip
            build/release/*.sha256
          if-no-files-found: error
          retention-days: 14
