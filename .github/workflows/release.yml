name: Prepare draft release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  draft-release:
    if: github.event.created
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check for an existing release
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          response=$(mktemp)
          trap 'rm -f "$response"' EXIT
          gh api "repos/$GH_REPO/releases?per_page=100" \
            --paginate --jq '.[] | .tag_name' > "$response"
          if python3 -c 'import sys; sys.exit(0 if sys.argv[1] in open(sys.argv[2]).read().splitlines() else 1)' "$GITHUB_REF_NAME" "$response"; then
            printf '%s\n' 'exists=true' >> "$GITHUB_OUTPUT"
            printf 'Release %s already exists; skipping.\n' "$GITHUB_REF_NAME"
          else
            printf '%s\n' 'exists=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Check tag matches app version
        if: steps.existing.outputs.exists != 'true'
        run: |
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Support/Info.plist)
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            printf 'Tag must match the app version: v%s\n' "$version" >&2
            exit 1
          fi
      - name: Test without live provider requests
        if: steps.existing.outputs.exists != 'true'
        run: bash Scripts/swift.sh test
      - name: Package universal app
        if: steps.existing.outputs.exists != 'true'
        run: bash Scripts/package-release.sh
      - name: Sign the update archive
        if: steps.existing.outputs.exists != 'true'
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          if [[ -z "$SPARKLE_PRIVATE_KEY" ]]; then
            printf '%s\n' 'Configure the SPARKLE_PRIVATE_KEY repository secret before preparing a release.' >&2
            exit 1
          fi
          bash Scripts/sign-update.sh build/release/*.zip
      - name: Create draft with downloads and checksums
        if: steps.existing.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            build/release/*.zip build/release/*.dmg build/release/*.sha256 build/release/update.json \
            --verify-tag --draft \
            --title "IP State ${GITHUB_REF_NAME#v}" \
            --notes-file docs/release-notes.md
